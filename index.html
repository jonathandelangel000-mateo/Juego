<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Focus Bird - Cargando...</title>
    <style>
        :root { --acento: #00f2ff; --fondo: #0a0a0a; }
        body, html { 
            background: var(--fondo); 
            color: white; 
            margin: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }

        .loader-container { text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        
        .logo-animado {
            font-size: 3rem;
            letter-spacing: 10px;
            color: white;
            text-shadow: 0 0 20px var(--acento);
            animation: pulse 1.5s infinite alternate;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            from { transform: scale(1); text-shadow: 0 0 10px var(--acento); }
            to { transform: scale(1.1); text-shadow: 0 0 30px var(--acento), 0 0 50px var(--acento); }
        }

        .bar-bg {
            width: 250px;
            height: 4px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            margin: 0 auto;
        }

        .bar-fill {
            width: 0%;
            height: 100%;
            background: var(--acento);
            box-shadow: 0 0 15px var(--acento);
            transition: width 0.3s;
        }

        .status-text {
            font-size: 0.7rem;
            color: var(--acento);
            margin-top: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ESTILO DE CRÉDITOS */
        .credits-footer {
            padding-bottom: 30px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.65rem;
            letter-spacing: 1px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }

        .credits-footer b {
            color: var(--acento);
            opacity: 0.8;
        }

        .linea-neon {
            width: 40px;
            height: 1px;
            background: var(--acento);
            margin: 10px auto;
            box-shadow: 0 0 10px var(--acento);
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="logo-animado">FOCUS BIRD</div>
        <div class="bar-bg">
            <div id="bar" class="bar-fill"></div>
        </div>
        <div id="status" class="status-text">Iniciando sistemas...</div>
    </div>

    <footer class="credits-footer">
        <div class="linea-neon"></div>
        POWERED BY <b>GEMINI AI</b><br>
        INFRASTRUCTURE: <b>FIREBASE GOOGLE</b><br>
        ENGINE: <b>ACODE</b>
        <div style="margin-top: 5px; color: rgba(255,255,255,0.6); letter-spacing: 2px;">
            DESARROLLADO POR <b>JONATHAN DEL ANGEL</b>
        </div>
    </footer>

    <script>
        // Simulación de carga de recursos y conexión
        let progress = 0;
        const bar = document.getElementById('bar');
        const status = document.getElementById('status');

        const steps = [
            { p: 20, t: "Conectando a la red neón..." },
            { p: 50, t: "Sincronizando monedas..." },
            { p: 80, t: "Cargando skins compradas..." },
            { p: 100, t: "¡Listo para volar!" }
        ];

        function startLoading() {
            let currentStep = 0;
            const interval = setInterval(() => {
                if (currentStep < steps.length) {
                    progress = steps[currentStep].p;
                    status.innerText = steps[currentStep].t;
                    bar.style.width = progress + "%";
                    currentStep++;
                } else {
                    clearInterval(interval);
                    // Pequeña pausa para que se vea el 100%
                    setTimeout(() => {
                        window.location.href = 'flapybird.html';
                    }, 500);
                }
            }, 800);
        }

        // Generar UUID de usuario si no existe antes de entrar
        if(!localStorage.getItem('focusBird_userId')) {
            const userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('focusBird_userId', userId);
        }

        window.onload = startLoading;
    </script>
</body>
</html>
