<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Focus Bird - Salón de la Fama</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <style>
        :root { 
            --acento: #ffda44; /* Dorado para los campeones */
            --fondo: #0a0a0a; 
            --cian: #00f2ff;
        }
        body, html { background: var(--fondo); color: white; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Arial Black', sans-serif; }
        
        canvas#leadCanvas { position: absolute; top: 0; left: 0; z-index: -1; pointer-events: none; }

        .container { 
            width: 100vw; height: 100vh; 
            display: flex; flex-direction: column; align-items: center; 
            padding-top: 20px; box-sizing: border-box; 
            z-index: 10; position: relative;
        }

        .header-leader { width: 90%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-volver { background: transparent; border: 2px solid var(--cian); color: var(--cian); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; }

        .titulo { font-size: 2rem; color: var(--acento); text-shadow: 0 0 15px var(--acento); letter-spacing: 3px; }

        .tabs-global { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { 
            background: #222; border: 2px solid transparent; color: #888; 
            padding: 10px 20px; border-radius: 20px; cursor: pointer; transition: 0.3s;
        }
        .tab-btn.active { border-color: var(--acento); color: var(--acento); box-shadow: 0 0 10px var(--acento); }

        .tabla-container { 
            width: 90%; max-width: 500px; background: rgba(0,0,0,0.6); 
            border-radius: 20px; border: 1px solid #333; padding: 15px;
            backdrop-filter: blur(10px); height: 60vh; overflow-y: auto;
        }

        table { width: 100%; border-collapse: collapse; }
        td { padding: 15px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .rank { width: 50px; font-weight: 900; color: var(--acento); font-size: 1.2rem; }
        .name { text-align: left; letter-spacing: 1px; }
        .score { text-align: right; color: var(--cian); font-weight: bold; }

        /* Estilo para el Top 3 */
        tr:nth-child(1) .rank { color: #ffda44; font-size: 1.5rem; } /* Oro */
        tr:nth-child(2) .rank { color: #c0c0c0; } /* Plata */
        tr:nth-child(3) .rank { color: #cd7f32; } /* Bronce */
    </style>
</head>
<body>

    <canvas id="leadCanvas"></canvas>

    <div class="container">
        <div class="header-leader">
            <button class="btn-volver" onclick="window.location.href='flapybird.html'">← MENÚ</button>
            <div class="titulo">WORLD TOP</div>
        </div>

        <div class="tabs-global">
            <button class="tab-btn active" onclick="loadGlobal('FACIL', this)">FÁCIL</button>
            <button class="tab-btn" onclick="loadGlobal('NORMAL', this)">NORMAL</button>
            <button class="tab-btn" onclick="loadGlobal('DIFICIL', this)">DIFÍCIL</button>
        </div>

        <div class="tabla-container">
            <table id="main-table">
                </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB0ahP8K53dm8BIRhjXYxCbSJ8sNfQi-NI",
            authDomain: "refugio-de-patitas.firebaseapp.com",
            projectId: "refugio-de-patitas",
            storageBucket: "refugio-de-patitas.firebasestorage.app",
            messagingSenderId: "5921473252",
            appId: "1:5921473252:web:16f18c4c7cf1ad1509e2f1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function loadGlobal(dif, btn) {
            // UI Update
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const tabla = document.getElementById('main-table');
            tabla.innerHTML = "<tr><td colspan='3' style='text-align:center'>CARGANDO LEYENDAS...</td></tr>";

            try {
                const snapshot = await db.collection("top_global_" + dif.toLowerCase())
                    .orderBy("score", "desc")
                    .limit(10)
                    .get();

                let html = "";
                let i = 1;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <tr>
                            <td class="rank">#${i}</td>
                            <td class="name">${data.name || 'ANÓNIMO'}</td>
                            <td class="score">${data.score}</td>
                        </tr>
                    `;
                    i++;
                });
                tabla.innerHTML = html || "<tr><td colspan='3' style='text-align:center'>NADIE HA RECLAMADO ESTE TRONO</td></tr>";
            } catch (e) {
                tabla.innerHTML = "<tr><td colspan='3' style='text-align:center'>ERROR DE CONEXIÓN</td></tr>";
            }
        }

        // Partículas doradas de fondo
        const canvas = document.getElementById("leadCanvas");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            for(let i=0; i<50; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    s: Math.random() * 2 + 0.5,
                    o: Math.random()
                });
            }
            animate();
        }

        function animate() {
            ctx.fillStyle = "#0a0a0a";
            ctx.fillRect(0,0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffda44";
            particles.forEach(p => {
                p.y -= p.s;
                ctx.globalAlpha = p.o;
                ctx.fillRect(p.x, p.y, 2, 2);
                if(p.y < 0) p.y = canvas.height;
            });
            requestAnimationFrame(animate);
        }

        window.onload = () => {
            init();
            loadGlobal('FACIL', document.querySelector('.tab-btn'));
        };
    </script>
</body>
</html>
