<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Focus Bird - Cyber Store</title>
    <style>
        :root { 
            --acento: #00f2ff; 
            --fondo: #050505; 
            --oro: #ffd700;
            --purpura: #bc13fe;
            --rojo: #ff0055;
        }
        body, html { background: var(--fondo); color: white; margin: 0; padding: 0; width: 100%; height: 100%; overflow-x: hidden; font-family: 'Arial Black', sans-serif; }
        
        .header { 
            padding: 20px; text-align: center; background: rgba(0,0,0,0.8);
            border-bottom: 2px solid var(--acento); position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px);
        }

        .monedas-top { color: var(--oro); font-size: 1.5rem; text-shadow: 0 0 10px var(--oro); }

        .container { padding: 20px; display: grid; gap: 20px; padding-bottom: 100px; }

        /* Tarjetas de Potenciadores */
        .item-card {
            background: linear-gradient(145deg, #0f0f0f, #1a1a1a);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            transition: 0.3s;
            overflow: hidden;
        }
        .item-card:active { transform: scale(0.95); }
        .item-card::after {
            content: ''; position: absolute; top: 0; left: 0; width: 5px; height: 100%;
        }

        /* Colores por tipo */
        .warp::after { background: var(--acento); box-shadow: 0 0 15px var(--acento); }
        .double::after { background: var(--oro); box-shadow: 0 0 15px var(--oro); }
        .shield::after { background: var(--purpura); box-shadow: 0 0 15px var(--purpura); }

        .item-info { flex-grow: 1; }
        .item-title { font-size: 1.1rem; letter-spacing: 1px; margin-bottom: 5px; }
        .item-desc { font-size: 0.75rem; color: #888; font-family: 'Arial', sans-serif; line-height: 1.2; }

        .btn-buy {
            background: transparent;
            border: 2px solid white;
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: bold;
            min-width: 80px;
            cursor: pointer;
        }
        .btn-buy.can-afford { border-color: #00ff00; color: #00ff00; }
        .btn-buy.no-money { border-color: var(--rojo); color: var(--rojo); opacity: 0.5; }

        .nav-inferior {
            position: fixed; bottom: 0; width: 100%; height: 70px;
            background: rgba(0,0,0,0.9); display: flex; justify-content: space-around;
            align-items: center; border-top: 1px solid #333; z-index: 100;
        }
        .nav-btn { color: #555; text-decoration: none; font-size: 0.8rem; text-align: center; }
        .nav-btn.active { color: var(--acento); }

        /* Animación de parpadeo para la invulnerabilidad */
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <div class="monedas-top">🪙 <span id="val-monedas">0</span></div>
        <div style="font-size: 0.6rem; color: var(--acento); margin-top: 5px; letter-spacing: 3px;">CYBERNETIC ENHANCEMENTS</div>
    </div>

    <div class="container">
        
        <div class="item-card warp">
            <div style="font-size: 2rem;">🚀</div>
            <div class="item-info">
                <div class="item-title">WARP DRIVE</div>
                <div class="item-desc">Salta instantáneamente 20 obstáculos. Incluye las 20 monedas de botín.</div>
            </div>
            <button class="btn-buy" onclick="comprar('warp', 500)">500</button>
        </div>

        <div class="item-card double">
            <div style="font-size: 2rem;">💎</div>
            <div class="item-info">
                <div class="item-title">DATA MINER</div>
                <div class="item-desc">Duplica todas las monedas obtenidas durante la siguiente partida.</div>
            </div>
            <button class="btn-buy" onclick="comprar('double', 350)">350</button>
        </div>

        <div class="item-card shield">
            <div style="font-size: 2rem;">🛡️</div>
            <div class="item-info">
                <div class="item-title">PHANTOM MODE</div>
                <div class="item-desc">Atraviesa 10 obstáculos sin morir. El ave parpadeará mientras sea activa.</div>
            </div>
            <button class="btn-buy" onclick="comprar('shield', 600)">600</button>
        </div>

    </div>

    <div class="nav-inferior">
        <a href="flapybird.html" class="nav-btn">MENÚ</a>
        <a href="tienda.html" class="nav-btn active">TIENDA</a>
        <a href="skins.html" class="nav-btn">SKINS</a>
    </div>

    <script>
        let monedas = parseInt(localStorage.getItem('birdCoins')) || 0;

        function actualizarUI() {
            document.getElementById('val-monedas').innerText = monedas;
            document.querySelectorAll('.btn-buy').forEach(btn => {
                let precio = parseInt(btn.innerText);
                if (monedas >= precio) {
                    btn.className = 'btn-buy can-afford';
                } else {
                    btn.className = 'btn-buy no-money';
                }
            });
        }

        function comprar(tipo, precio) {
            if (monedas >= precio) {
                monedas -= precio;
                localStorage.setItem('birdCoins', monedas);
                
                // Guardar el potenciador para la siguiente partida
                // 0 = no tiene, 1 = tiene
                localStorage.setItem('powerup_' + tipo, '1');
                
                actualizarUI();
                alert('¡POTENCIADOR EQUIPADO PARA LA PRÓXIMA PARTIDA!');
            } else {
                alert('CRÉDITOS INSUFICIENTES');
            }
        }

        window.onload = actualizarUI;
    </script>
</body>
</html>
